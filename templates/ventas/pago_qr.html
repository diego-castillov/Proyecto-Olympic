{% extends "base.html" %}
{% load static %}

{% block contenido %}
    <div>
        <h2>Pago con QR</h2>
        <p>Escanea este codigo desde la aplicacion de tu banco</p>
        <div id="contenedor-qr">
            <img src="{% static "img/qr_falso.png" %}" alt="QR de Pago">
            <p>Esperando confirmacion del banco...</p>
            <div class="spinner"></div>
        </div>
        <div id="mensaje-exito" style="display: none; color: green;">
            <img src="{% static "img/checked.png" %}" alt="Exito">
            <h3>¡Pago Exitoso!</h3>
            <p>Tu transaccion ha sido aprobada. Redirigiendo a tus compras...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function()) {
            const idPedido = "{{ pedido.id_pedido }}";
            const urlVerificacion = `/api/verificar-pago/${idPedido}/`;

            const intervaloRadar = setInterval(function() {
                fetch(urlVerificacion)
                    .then(response => response.json())
                    .then(data => {
                        if(data.estado_pago === 'Pagado') {
                            clearInterval(intervaloRadar);
                            document.getElementById('contenedor-qr').style.display = 'none';
                            document.getElementById('mensaje-exito').style.display = 'block';

                            setTimeout(() => {
                                window.location.href = "{% url 'inicio' %}";
                            }, 3000);
                        }
                    })
                    .catch(error => console.error("Error consultando el pago:", error));
            }), 3000);
        });
    </script>
{% endblock %}
